<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f9d58" />
  <title>KrishiSathi — Offline</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app-main" style="display:grid;place-items:center;min-height:100dvh;padding-bottom:2rem;">
    <div class="card center" style="max-width:430px;">
      <span style="display:grid;place-items:center;width:64px;height:64px;margin:0 auto;border-radius:999px;background:var(--brand-50);color:var(--brand-600);">
        <svg class="icon" style="width:30px;height:30px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 3-2"/><path d="M12 20h.01"/></svg>
      </span>
      <h2 style="margin-top:1rem;">You're offline</h2>
      <p class="muted" style="margin-top:0.4rem;">KrishiSathi needs an internet connection for live mandi prices, weather and the AI. Reconnect and try again — your device will open the app automatically.</p>
      <a class="btn btn-primary" style="margin-top:1.1rem;" href="/">Try again</a>
    </div>
  </main>
</body>
</html>
